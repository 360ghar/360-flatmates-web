[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_BASE_URL = "https://api.360ghar.com/api/v1"

# Build-time listing fetches (sitemap + per-listing prerender) gate themselves
# on `process.env.CONTEXT === "production"`. Netlify sets CONTEXT automatically
# per deploy: `production` (push to main), `deploy-preview` (PR), or
# `branch-deploy`. So preview builds skip listing fetches and local builds
# (CONTEXT unset) skip them too — no PRERENDER_* env var is needed here.

# Security headers (W28). CSP ships as Report-Only first so a missed origin
# cannot break production; switch to enforcing once reports are clean.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://api.360ghar.com https://*.supabase.co wss://*.supabase.co https://*.googleapis.com https://nominatim.openstreetmap.org; frame-src https://*.supabase.co https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
